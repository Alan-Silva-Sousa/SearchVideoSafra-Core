services:
  postgres:
    image: postgres:16-alpine
    container_name: searchvideo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-searchvideo}
      POSTGRES_USER: ${DB_USERNAME:-searchvideo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-searchvideo_dev}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - searchvideo_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-searchvideo} -d ${DB_DATABASE:-searchvideo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  searchvideo_postgres_data:
    name: searchvideo_postgres_data
